server {
    server_name mogotor.rootfox.cc;


    location = /rabbit {
        return 301 /rabbit/;
    }

    location /rabbit/ {
        proxy_pass http://127.0.0.1:15672;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mogotor.rootfox.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mogotor.rootfox.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mogotor.rootfox.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name mogotor.rootfox.cc;

    listen 80;
    return 404; # managed by Certbot


}